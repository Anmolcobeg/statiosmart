<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StatioSmart — Credit</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="font-awesome-local.css"/>
</head>
<body class="app-body">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon sm"><i class="fas fa-pen-nib"></i></div>
      <span class="brand-name-sm">StatioSmart</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
      <a href="inventory.html" class="nav-item"><i class="fas fa-boxes"></i><span>Inventory</span></a>
      <a href="sales.html" class="nav-item"><i class="fas fa-receipt"></i><span>Sales</span></a>
      <a href="credit.html" class="nav-item active"><i class="fas fa-credit-card"></i><span>Credit</span></a>
      <a href="analysis.html" class="nav-item"><i class="fas fa-chart-bar"></i><span>Analysis</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-details">
          <p class="user-name" id="user-name">Loading...</p>
          <p class="user-shop" id="user-shop">Shop</p>
        </div>
      </div>
      <button class="btn-logout" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>

  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <main class="main-content">
    <header class="top-bar">
      <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="top-bar-left">
        <h2 class="page-title">Credit</h2>
        <p class="page-subtitle">Manage credit transactions and customer accounts</p>
      </div>
      <div class="top-bar-right">
        <button class="btn-primary sm" onclick="openNewCredit()">
          <i class="fas fa-plus"></i> New Credit
        </button>
      </div>
    </header>

    <!-- Credit Summary Cards -->
    <section class="stats-grid">
      <div class="stat-card accent-blue">
        <div class="stat-icon"><i class="fas fa-hand-holding-dollar"></i></div>
        <div class="stat-info">
          <p class="stat-label">Total Outstanding</p>
          <h3 class="stat-value" id="total-outstanding">₹0</h3>
        </div>
      </div>
      <div class="stat-card accent-amber">
        <div class="stat-icon"><i class="fas fa-users"></i></div>
        <div class="stat-info">
          <p class="stat-label">Active Customers</p>
          <h3 class="stat-value" id="active-customers">0</h3>
        </div>
      </div>
      <div class="stat-card accent-green">
        <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info">
          <p class="stat-label">Paid This Month</p>
          <h3 class="stat-value" id="paid-this-month">₹0</h3>
        </div>
      </div>
      <div class="stat-card accent-red">
        <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-info">
          <p class="stat-label">Overdue</p>
          <h3 class="stat-value" id="overdue-amount">₹0</h3>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search by customer..." id="credit-search" oninput="filterCredit()"/>
      </div>
      <select class="filter-select" id="credit-status-filter" onchange="filterCredit()">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="paid">Paid</option>
        <option value="overdue">Overdue</option>
      </select>
      <button class="btn-secondary sm" onclick="clearCreditFilters()">
        <i class="fas fa-times"></i> Clear
      </button>
    </div>

    <!-- Credit Table -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Due Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="credit-body">
          <!-- Credit records will be populated here -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- New Credit Modal -->
  <div class="modal-overlay hidden" id="credit-modal">
    <div class="modal" id="credit-modal-content">
      <div class="modal-header">
        <h3 id="credit-modal-title">New Credit Transaction</h3>
        <button class="modal-close" onclick="closeModal('credit-modal')"><i class="fas fa-times"></i></button>
      </div>
      <form id="credit-form" onsubmit="saveCredit(event)">
        <input type="hidden" id="credit-id" />
        <div class="form-group">
          <label for="c-customer">Customer Name</label>
          <input type="text" id="c-customer" required />
        </div>
        <div class="form-group">
          <label for="c-amount">Amount (₹)</label>
          <input type="number" id="c-amount" step="0.01" required />
        </div>
        <div class="form-group">
          <label for="c-due-date">Due Date</label>
          <input type="date" id="c-due-date" required />
        </div>
        <div class="form-group">
          <label for="c-note">Note</label>
          <textarea id="c-note" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('credit-modal')">Cancel</button>
          <button type="submit" class="btn-primary">Save Credit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Payment Modal -->
  <div class="modal-overlay hidden" id="payment-modal">
    <div class="modal" id="payment-modal-content">
      <div class="modal-header">
        <h3>Record Payment</h3>
        <button class="modal-close" onclick="closeModal('payment-modal')"><i class="fas fa-times"></i></button>
      </div>
      <form id="payment-form" onsubmit="savePayment(event)">
        <input type="hidden" id="payment-credit-id" />
        <div class="form-group">
          <label>Customer</label>
          <p id="payment-customer-name"></p>
        </div>
        <div class="form-group">
          <label>Outstanding Amount</label>
          <p id="payment-outstanding"></p>
        </div>
        <div class="form-group">
          <label for="p-amount">Payment Amount (₹)</label>
          <input type="number" id="p-amount" step="0.01" required />
        </div>
        <div class="form-group">
          <label for="p-note">Payment Note</label>
          <textarea id="p-note" rows="2"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('payment-modal')">Cancel</button>
          <button type="submit" class="btn-primary">Record Payment</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
